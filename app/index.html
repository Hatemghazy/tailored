<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>tAIlored — interactive prototype</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   tAIlored — "Depth Field"
   A measuring instrument that happens to sell shoes.
   Cool aqua = measurement and truth.  Warm ember = action.
   ============================================================ */
:root{
  /* exact values from your Figma "2. Semantic" collection, Light mode */
  --bg:#ffffff; --surface:#ffffff; --subtle:#f5f5f5; --muted:#e6e6e6;
  --hair:#e6e6e6; --hair-strong:#cccccc;

  --primary:#0f5c56; --primary-hover:#0d4f4a; --primary-subtle:#eaf6f4; --primary-on:#ffffff;
  --accent:#d9714e; --accent-hover:#c85a34; --accent-subtle:#fdf1ec; --accent-on:#ffffff;

  --ink:#1a1a1a; --ink-2:#666666; --ink-3:#808080;

  --success:#2d9159; --success-subtle:#eef8f2; --success-border:#8fcfa9;
  --warning:#d08f2a; --warning-subtle:#fef7ea; --warning-border:#f3cc8a;
  --error:#c13b3b; --error-subtle:#fdefee; --error-border:#e8938f;
  --info:#2678aa; --info-subtle:#eef7fc; --info-border:#8fc4e0;

  --primary-glow:rgba(15,92,86,.22); --accent-glow:rgba(217,113,78,.30);
  --r-s:10px; --r-m:16px; --r-l:22px; --r-xl:30px;
  --ease:cubic-bezier(.16,.84,.28,1);
  --spring:cubic-bezier(.34,1.42,.44,1);
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'IBM Plex Sans Arabic',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:#e9eceb; color:var(--ink);
  display:flex; align-items:flex-start; justify-content:center; gap:32px;
  padding:30px 22px 56px; min-height:100%;
  -webkit-font-smoothing:antialiased;
  font-feature-settings:'tnum' 1;
}
body::before{ content:none; }
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:3px;border-radius:6px}

/* ---------- device ---------- */
.device{
  width:390px; height:844px; flex:0 0 auto; position:sticky; top:30px; z-index:1;
  border-radius:46px; background:var(--bg); overflow:hidden;
  display:flex; flex-direction:column;
  box-shadow:
    0 0 0 10px #16181a, 0 0 0 11px rgba(0,0,0,.08),
    0 40px 90px rgba(0,0,0,.35);
}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);}
/* topographic signature, same motif as the dark build, tuned faint for a light surface */
.screen::before{
  content:''; position:absolute; inset:-40% -20% auto -20%; height:120%; pointer-events:none; opacity:.6;
  background-image:
    radial-gradient(closest-side, transparent 0 62%, rgba(15,92,86,.05) 62.6% 63.4%, transparent 64%),
    radial-gradient(closest-side, transparent 0 52%, rgba(15,92,86,.045) 52.6% 53.4%, transparent 54%),
    radial-gradient(closest-side, transparent 0 42%, rgba(15,92,86,.04) 42.6% 43.4%, transparent 44%),
    radial-gradient(closest-side, transparent 0 32%, rgba(15,92,86,.035) 32.6% 33.4%, transparent 34%),
    radial-gradient(closest-side, transparent 0 22%, rgba(15,92,86,.03) 22.6% 23.4%, transparent 24%);
  background-repeat:no-repeat; background-size:150% 90%; background-position:50% 30%;
}
.screen.cam-screen::before{content:none}

/* ---------- status bar ---------- */
.statusbar{height:54px;flex:0 0 auto;display:flex;align-items:flex-end;justify-content:space-between;
  padding:0 26px 8px;font-size:13px;font-weight:600;color:var(--ink);position:relative;z-index:2}
.sb-icons{display:flex;align-items:flex-end;gap:4px;height:12px}
.sb-icons i{display:block;width:3px;border-radius:2px;background:currentColor;opacity:.85}
.sb-batt{width:23px;height:11px;border:1px solid currentColor;border-radius:3px;position:relative;opacity:.6;margin-left:3px}
.sb-batt::after{content:'';position:absolute;inset:2px;right:7px;background:var(--primary);border-radius:1px}

/* ---------- app bar ---------- */
.appbar{height:58px;flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:0 12px;
  position:relative;z-index:2}
.appbar h1{font-size:17px;font-weight:600;flex:1;letter-spacing:-.01em;text-align:center}
.iconbtn{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:var(--ink);
  flex:0 0 auto;transition:background .2s var(--ease),transform .2s var(--spring);position:relative}
.iconbtn:hover{background:var(--subtle)}
.iconbtn:active{transform:scale(.9)}
.iconbtn svg{width:22px;height:22px}

/* ---------- content ---------- */
.content{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:8px 18px 26px;
  display:flex;flex-direction:column;gap:14px;position:relative;z-index:2;scrollbar-width:none}
.content::-webkit-scrollbar{display:none}
.content.center{justify-content:center;align-items:center;text-align:center}
.spacer{flex:1 1 auto;min-height:10px}
.content > *{flex-shrink:0}
.content > .spacer{flex-shrink:1}

/* staggered entrance — one orchestrated reveal per screen, not per element hover */
.screen.enter .content > *{animation:lift .5s var(--ease) backwards}
.screen.enter .content > *:nth-child(1){animation-delay:.02s}
.screen.enter .content > *:nth-child(2){animation-delay:.06s}
.screen.enter .content > *:nth-child(3){animation-delay:.10s}
.screen.enter .content > *:nth-child(4){animation-delay:.14s}
.screen.enter .content > *:nth-child(5){animation-delay:.18s}
.screen.enter .content > *:nth-child(n+6){animation-delay:.21s}
@keyframes lift{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

h2.title{font-family:'Sora',sans-serif;font-size:27px;font-weight:600;letter-spacing:-.035em;line-height:1.18}
p.sub{font-size:14px;color:var(--ink-2);line-height:1.55}
p.note{font-size:12px;color:var(--ink-3);line-height:1.5}
.sect{font-size:13px;font-weight:600;color:var(--ink-2);letter-spacing:.02em;margin-top:6px;
  display:flex;align-items:center;gap:9px}
.sect::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--hair),transparent)}

/* ---------- buttons ---------- */
.btn{height:56px;border-radius:18px;display:flex;align-items:center;justify-content:center;gap:9px;
  font-size:16px;font-weight:600;width:100%;flex:0 0 auto;padding:0 22px;position:relative;overflow:hidden;
  transition:transform .22s var(--spring),box-shadow .3s var(--ease),opacity .2s}
.btn:active{transform:scale(.965)}
.btn svg{width:19px;height:19px}
.btn-accent{background:linear-gradient(135deg,var(--accent),var(--accent-hover));color:#fff;
  box-shadow:0 10px 26px -10px var(--accent-glow)}
.btn-accent:hover{box-shadow:0 14px 32px -10px var(--accent-glow)}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-hover));color:#fff;
  box-shadow:0 10px 26px -10px var(--primary-glow)}
.btn-secondary{background:var(--primary-subtle);color:var(--primary);border:1px solid var(--hair-strong)}
.btn-secondary:hover{background:#dcf1ee}
.btn-tertiary{background:transparent;color:var(--primary);font-weight:600}
.btn-tertiary:hover{background:var(--subtle)}
.btn-destructive{background:linear-gradient(135deg,var(--error),#a32b2b);color:#fff;
  box-shadow:0 10px 26px -10px rgba(193,59,59,.4)}
.btn:disabled{background:var(--muted);color:#a9a9a9;box-shadow:none;cursor:not-allowed;border-color:transparent}
.btn.md{height:48px;font-size:15px}
.btn.sm{height:38px;font-size:13px;width:auto;padding:0 18px;border-radius:13px}
/* sheen sweeps once on the primary action of a screen */
.btn-accent::after,.btn-primary::after{content:'';position:absolute;top:0;bottom:0;width:44%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.38),transparent);
  transform:translateX(-180%);animation:sheen 4.6s var(--ease) 1.1s infinite}
@keyframes sheen{0%{transform:translateX(-180%)}22%,100%{transform:translateX(340%)}}

/* ---------- surfaces ---------- */
.card{background:var(--surface);
  border:1px solid var(--hair);border-radius:var(--r-l);padding:18px;position:relative;overflow:hidden;
  box-shadow:0 1px 2px rgba(20,30,28,.04);flex-shrink:0}
.card.tap{cursor:pointer;transition:transform .3s var(--spring),border-color .3s var(--ease),box-shadow .3s}
.card.tap:hover{transform:translateY(-3px);border-color:var(--hair-strong);box-shadow:0 18px 34px -22px rgba(15,92,86,.35)}
.card.tap:active{transform:scale(.985)}

.row{display:flex;align-items:center;gap:13px;padding:13px 14px;width:100%;text-align:left;
  border-radius:var(--r-m);background:var(--subtle);border:1px solid transparent;
  transition:background .22s var(--ease),border-color .22s,transform .22s var(--spring)}
.row.tap{cursor:pointer}
.row.tap:hover{background:var(--primary-subtle);border-color:var(--hair)}
.row.tap:active{transform:scale(.985)}
.row .rt{flex:1;min-width:0}
.row .rt b{display:block;font-size:15px;font-weight:600}
.row .rt span{display:block;font-size:12px;color:var(--ink-3);margin-top:3px;line-height:1.4}
.row .rv{font-size:14px;font-weight:600;color:var(--primary);white-space:nowrap;font-variant-numeric:tabular-nums}
.row .chev{color:var(--ink-3);flex:0 0 auto;transition:transform .25s var(--spring)}
.row.tap:hover .chev{transform:translateX(4px);color:var(--primary)}
.dot{width:40px;height:40px;border-radius:13px;flex:0 0 auto;display:grid;place-items:center;
  background:var(--primary-subtle);border:1px solid var(--hair);color:var(--primary)}
.dot svg{width:20px;height:20px}
.dot.warm{background:var(--accent-subtle);border-color:#f3d9cc;color:var(--accent)}

/* ---------- alerts / badges ---------- */
.alert{display:flex;gap:11px;align-items:flex-start;padding:13px 14px;border-radius:var(--r-m);
  font-size:13px;line-height:1.5;border:1px solid;position:relative;overflow:hidden;flex-shrink:0}
.alert svg{width:18px;height:18px;flex:0 0 auto;margin-top:1px}
.alert.info{background:var(--info-subtle);border-color:var(--info-border);color:var(--info)}
.alert.success{background:var(--success-subtle);border-color:var(--success-border);color:var(--success)}
.alert.warning{background:var(--warning-subtle);border-color:var(--warning-border);color:var(--warning)}
.alert.error{background:var(--error-subtle);border-color:var(--error-border);color:var(--error)}
.badge{display:inline-flex;align-items:center;gap:6px;height:27px;padding:0 11px;border-radius:999px;
  font-size:12px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums;border:1px solid}
.badge.success{background:var(--success-subtle);color:var(--success);border-color:var(--success-border)}
.badge.warning{background:var(--warning-subtle);color:var(--warning);border-color:var(--warning-border)}
.badge.error{background:var(--error-subtle);color:var(--error);border-color:var(--error-border)}
.badge.neutral{background:var(--subtle);color:var(--ink-2);border-color:var(--hair)}

/* ---------- chips ---------- */
.chips{display:flex;gap:9px;flex-wrap:wrap}
.chip{height:40px;padding:0 16px;border-radius:14px;border:1px solid var(--hair-strong);
  font-size:14px;font-weight:600;color:var(--ink-2);background:var(--surface);
  display:inline-flex;align-items:center;transition:all .25s var(--ease)}
.chip:hover{color:var(--ink);border-color:var(--primary)}
.chip[aria-pressed="true"]{border-color:transparent;color:#fff;
  background:linear-gradient(135deg,var(--primary),var(--primary-hover));
  box-shadow:0 6px 18px -6px var(--primary-glow)}
.chip:disabled{opacity:.4;cursor:not-allowed;text-decoration:line-through}

/* ---------- tab bar ---------- */
.tabbar{height:66px;flex:0 0 auto;display:flex;position:relative;z-index:3;padding:0 6px;
  background:rgba(255,255,255,.92);
  backdrop-filter:blur(22px);border-top:1px solid var(--hair)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  font-size:10px;font-weight:600;color:var(--ink-3);position:relative;transition:color .25s var(--ease)}
.tab svg{width:23px;height:23px;transition:transform .35s var(--spring)}
.tab:hover{color:var(--ink-2)}
.tab[aria-current="page"]{color:var(--primary)}
.tab[aria-current="page"] svg{transform:translateY(-2px) scale(1.08)}
.tab[aria-current="page"]::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:34px;height:2px;border-radius:2px;background:var(--primary);box-shadow:0 0 14px 2px var(--primary-glow);
  animation:tabIn .45s var(--spring)}
@keyframes tabIn{from{width:0;opacity:0}to{width:34px;opacity:1}}
.homeind{height:30px;flex:0 0 auto;display:grid;place-items:center;position:relative;z-index:3}
.homeind i{width:138px;height:5px;border-radius:3px;background:rgba(26,26,26,.16);display:block}

/* ---------- confidence ring ---------- */
.confring{display:flex;align-items:center;gap:18px;padding:18px;border-radius:var(--r-l);
  border:1px solid var(--hair);background:var(--primary-subtle)}
.confring.low{border-color:var(--error-border);background:var(--error-subtle)}
.confring.medium{border-color:var(--warning-border);background:var(--warning-subtle)}
.confring svg{width:88px;height:88px;flex:0 0 auto;transform:rotate(-90deg)}
.confring .track{stroke:var(--muted)}
.confring .prog{stroke-linecap:round;transition:stroke-dashoffset 1.1s var(--ease)}
.confring .num{position:absolute;inset:0;display:grid;place-items:center;font-family:'Sora',sans-serif;
  font-size:21px;font-weight:600;letter-spacing:-.03em;white-space:nowrap}
.confring .ringwrap{position:relative;width:88px;height:88px;flex:0 0 auto}
.confring .meta b{display:block;font-size:15px;font-weight:600;margin-bottom:5px}
.confring .meta span{display:block;font-size:12.5px;color:var(--ink-2);line-height:1.5}

/* ---------- fit scale ---------- */
.fit{display:flex;flex-direction:column;gap:8px}
.fit-scale{display:flex;gap:4px;height:9px}
.fit-scale i{flex:1;border-radius:999px;background:var(--muted);display:block;
  transform-origin:center;transition:all .4s var(--spring)}
.fit-scale i.on{transform:scaleY(1.5)}
.fit-cap{font-size:13px;font-weight:600;letter-spacing:-.01em;display:flex;align-items:center;gap:6px}
.fit-cap svg{flex:0 0 auto;width:14px;height:14px}

/* ---------- data readout ---------- */
.stats{display:flex;gap:8px}
.stat{flex:1;min-width:0}
.stat.hero{flex:1.3}
.stat .lbl{font-size:10px;font-weight:600;letter-spacing:.12em;color:var(--ink-3);text-transform:uppercase}
.stat .val{font-family:'Sora',sans-serif;font-size:24px;font-weight:600;letter-spacing:-.045em;margin-top:4px;
  color:var(--ink);font-variant-numeric:tabular-nums;line-height:1;white-space:nowrap}
.stat .val u{text-decoration:none;font-size:12px;font-weight:500;color:var(--ink-3);margin-left:3px;letter-spacing:0}
.stat.hero .val{font-size:31px;color:var(--primary)}

.sizehero{font-family:'Sora',sans-serif;font-size:30px;font-weight:600;letter-spacing:-.03em;line-height:1;
  color:var(--primary)}

/* ---------- product art ---------- */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pcard{text-align:left;display:flex;flex-direction:column;gap:8px;cursor:pointer;
  transition:transform .3s var(--spring)}
.pcard:hover{transform:translateY(-4px)}
.pcard:active{transform:scale(.97)}
.pimg{aspect-ratio:8/5;border-radius:var(--r-m);position:relative;overflow:hidden;
  border:1px solid var(--hair);display:grid;place-items:center;background:var(--subtle)}
.pimg svg{width:92%;height:92%}
.pimg .shine{position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.55) 50%,transparent 60%);
  transform:translateX(-100%);transition:transform .8s var(--ease)}
.pcard:hover .pimg .shine{transform:translateX(100%)}
.pcard .pb{font-size:10px;font-weight:700;letter-spacing:.16em;color:var(--ink-3)}
.pcard .pn{font-size:13.5px;font-weight:600;line-height:1.35}
.pcard .pp{font-size:14px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.pcard.out .pimg{opacity:.45;filter:grayscale(.7)}

.tile{display:flex;flex-direction:column;padding:0;overflow:hidden;
  border:1px solid var(--hair);border-top:3px solid var(--hair-strong);border-radius:var(--r-l);
  cursor:pointer;text-align:left;background:var(--surface);box-shadow:0 1px 2px rgba(20,30,28,.04);
  transition:transform .3s var(--spring),border-color .3s,box-shadow .3s,opacity .3s;flex-shrink:0}
.tile:hover{transform:translateY(-4px);border-color:var(--hair-strong);box-shadow:0 20px 36px -22px rgba(15,92,86,.32)}
.tile:active{transform:scale(.98)}
.tile b{font-size:15.5px;letter-spacing:-.01em}
.tile span{font-size:12px;color:var(--ink-3)}
.tile-media{position:relative;aspect-ratio:8/5;display:grid;place-items:center;
  background:var(--subtle);border-bottom:1px solid var(--hair)}
.tile-media::before{content:'';position:absolute;inset:0;
  background:radial-gradient(65% 65% at 50% 38%,rgba(255,255,255,.9),transparent 72%);pointer-events:none}
.tile-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px}
.tile-badge{position:absolute;top:8px;right:8px;height:23px;padding:0 9px;font-size:11px}
.tile-sub{display:inline-flex;align-items:center;gap:5px}
.tile-sub svg{flex:0 0 auto;width:12px;height:12px;opacity:.55}
.tile.dim{opacity:.7}
.tile.dim:hover{transform:none;box-shadow:0 1px 2px rgba(20,30,28,.04)}
.tile.dim .tile-media{filter:grayscale(.35)}
.tile.tier-success{border-top-color:var(--success)}
.tile.tier-success .tile-media{background:var(--success-subtle)}
.tile.tier-warning{border-top-color:var(--warning)}
.tile.tier-warning .tile-media{background:var(--warning-subtle)}
.tile.tier-error{border-top-color:var(--error)}
.tile.tier-error .tile-media{background:var(--error-subtle)}
.tile.tier-neutral{border-top-color:var(--hair-strong)}
.card.tier-success{border-left:3px solid var(--success)}
.card.tier-warning{border-left:3px solid var(--warning)}
.card.tier-error{border-left:3px solid var(--error)}
.card.tier-neutral{border-left:3px solid var(--hair-strong)}
.mono{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;
  font-family:'Sora',sans-serif;font-size:17px;font-weight:600;color:#fff}
.brandmark{display:inline-flex;align-items:center;justify-content:center;border-radius:13px;
  padding:0 11px;flex:0 0 auto;white-space:nowrap;font-family:'Sora',sans-serif;line-height:1;
  position:relative;z-index:1}
.brandmark.bordered{border:1px solid var(--hair-strong)}
.brandmark.icon{padding:0;background:#fff;box-shadow:0 6px 16px -6px rgba(20,30,28,.22)}
.brandmark.icon svg{display:block}

/* ---------- inputs ---------- */
.field{display:flex;flex-direction:column;gap:8px}
.field label{font-size:12px;font-weight:600;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase}
.field input{height:56px;border-radius:var(--r-m);border:1px solid var(--hair-strong);
  background:var(--subtle);padding:0 16px;font-size:16px;color:var(--ink);width:100%;
  transition:border-color .25s,box-shadow .25s}
.field input::placeholder{color:var(--ink-3)}
.field input:focus{border-color:var(--primary);outline:none;background:#fff;box-shadow:0 0 0 4px var(--primary-subtle)}
.field.err input{border-color:var(--error)}
.field .msg{font-size:12px;color:var(--error);font-weight:600}
.phone-wrap{display:flex;gap:9px}
.phone-wrap .cc{height:56px;display:flex;align-items:center;padding:0 15px;border:1px solid var(--hair-strong);
  border-radius:var(--r-m);font-size:16px;font-weight:600;background:var(--subtle);flex:0 0 auto}
.otp{display:flex;gap:9px;justify-content:space-between}
.otp input{width:50px;height:62px;text-align:center;font-family:'Sora',sans-serif;font-size:24px;font-weight:600;
  border-radius:var(--r-m);border:1px solid var(--hair-strong);background:var(--subtle);color:var(--ink)}
.otp input:focus{border-color:var(--primary);outline:none;background:#fff;box-shadow:0 0 0 4px var(--primary-subtle)}
.otp.err input{border-color:var(--error);animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.opt{display:flex;gap:13px;align-items:center;padding:15px;border:1px solid var(--hair);
  border-radius:var(--r-m);cursor:pointer;text-align:left;width:100%;background:var(--subtle);
  transition:all .25s var(--ease)}
.opt:hover{border-color:var(--hair-strong)}
.opt[aria-checked="true"]{border-color:var(--primary);background:var(--primary-subtle);
  box-shadow:0 10px 24px -18px var(--primary-glow)}
.opt .rad{width:21px;height:21px;border-radius:50%;border:2px solid var(--hair-strong);flex:0 0 auto;
  display:grid;place-items:center;transition:border-color .25s}
.opt[aria-checked="true"] .rad{border-color:var(--primary)}
.opt[aria-checked="true"] .rad::after{content:'';width:11px;height:11px;border-radius:50%;background:var(--primary);
  box-shadow:0 0 10px var(--primary-glow);animation:pop .3s var(--spring)}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.opt .ot{flex:1}
.opt .ot b{display:block;font-size:15px;font-weight:600}
.opt .ot span{display:block;font-size:12px;color:var(--ink-3);margin-top:3px}
.switch{width:50px;height:30px;border-radius:999px;background:var(--muted);position:relative;
  flex:0 0 auto;transition:background .3s var(--ease)}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .35s var(--spring)}
.switch[aria-checked="true"]{background:linear-gradient(135deg,var(--primary),var(--primary-hover))}
.switch[aria-checked="true"]::after{transform:translateX(20px)}

/* ---------- camera / scan ---------- */
.cam{position:absolute;inset:0;overflow:hidden;background:#04100E}
.cam canvas{position:absolute;inset:0;width:100%;height:100%}
.cam-vig{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(70% 50% at 50% 45%,transparent 40%,rgba(0,0,0,.72) 100%)}
.cam-msg{position:absolute;left:50%;bottom:176px;transform:translateX(-50%);display:flex;align-items:center;gap:9px;
  max-width:calc(100% - 40px);white-space:normal;text-align:left;line-height:1.35;
  background:rgba(4,16,14,.72);backdrop-filter:blur(16px);border:1px solid var(--hair);
  color:var(--ink);padding:11px 17px;border-radius:22px;font-size:13px;font-weight:600;
  animation:lift .45s var(--ease)}
.cam-msg svg{width:17px;height:17px;flex:0 0 auto}
.cam-msg.bad{border-color:rgba(255,95,109,.4);color:#FF8A94}
.cam-msg.good{border-color:var(--hair-strong);color:var(--primary)}
.shutter{position:absolute;left:50%;bottom:78px;transform:translateX(-50%);width:76px;height:76px;
  border-radius:50%;display:grid;place-items:center;border:2px solid rgba(255,255,255,.28);
  transition:transform .25s var(--spring)}
.shutter i{width:60px;height:60px;border-radius:50%;display:block;
  background:linear-gradient(140deg,var(--primary),var(--primary-hover));
  box-shadow:0 0 30px -4px var(--primary-glow);transition:transform .18s var(--spring)}
.shutter:hover{transform:translateX(-50%) scale(1.05)}
.shutter:active i{transform:scale(.85)}
.shutter:disabled{opacity:.35;cursor:not-allowed}
.shutter:disabled i{background:rgba(255,255,255,.3);box-shadow:none}
.shutter::before{content:'';position:absolute;inset:-9px;border-radius:50%;border:1px solid var(--hair-strong);
  animation:pulse 2.4s var(--ease) infinite}
.shutter:disabled::before{display:none}
@keyframes pulse{0%{transform:scale(1);opacity:.9}70%{transform:scale(1.22);opacity:0}100%{opacity:0}}
.cam-top{position:absolute;top:58px;left:0;right:0;display:flex;align-items:center;justify-content:space-between;
  padding:0 18px;z-index:4}
.cam-top button{font-size:15px;font-weight:600;color:var(--ink-2);padding:8px}
.cam-pill{font-size:11px;font-weight:700;letter-spacing:.1em;background:rgba(4,16,14,.6);
  border:1px solid var(--hair);padding:7px 13px;border-radius:999px;color:var(--primary);text-transform:uppercase;
  backdrop-filter:blur(12px)}

/* ---------- processing ---------- */
.proc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:26px;padding:0 34px;text-align:center;background:#0B1F1B}
.proc canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.75}
.proc .inner{position:relative;z-index:2;width:100%;display:flex;flex-direction:column;align-items:center;gap:20px}
.proc h2{font-family:'Sora',sans-serif;font-size:24px;font-weight:600;letter-spacing:-.035em}
.proc .bar{width:100%;height:3px;border-radius:999px;background:rgba(255,255,255,.09);overflow:hidden}
.proc .bar i{display:block;height:100%;border-radius:999px;
  background:linear-gradient(90deg,var(--primary),#7BF0DC);box-shadow:0 0 14px var(--primary-glow);transition:width .3s linear}
.proc .step{font-size:13px;color:var(--ink-2);min-height:20px;font-variant-numeric:tabular-nums}

/* ---------- sheet ---------- */
.scrim{position:absolute;inset:0;background:rgba(2,8,7,.68);backdrop-filter:blur(8px);
  display:flex;align-items:flex-end;animation:fadein .25s var(--ease);z-index:20}
.sheet{width:100%;border-radius:var(--r-xl) var(--r-xl) 0 0;padding:12px 18px 30px;
  background:linear-gradient(180deg,#ffffff,#fafaf9);
  border-top:1px solid var(--hair-strong);
  box-shadow:0 -20px 60px rgba(0,0,0,.14);
  display:flex;flex-direction:column;gap:14px;animation:rise .42s var(--spring)}
.sheet .handle{width:38px;height:4px;border-radius:2px;background:rgba(255,255,255,.2);margin:0 auto 8px}
@keyframes rise{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes fadein{from{opacity:0}to{opacity:1}}

/* ---------- toast ---------- */
.toasts{position:absolute;left:18px;right:18px;bottom:104px;display:flex;flex-direction:column;gap:9px;
  z-index:40;pointer-events:none}
.toast{display:flex;gap:11px;align-items:center;padding:13px 15px;border-radius:var(--r-m);
  font-size:13px;font-weight:600;animation:toastIn .45s var(--spring);backdrop-filter:blur(18px);
  background:rgba(20,28,26,.94);border:1px solid rgba(255,255,255,.08);color:#fff;
  box-shadow:0 16px 34px -14px rgba(0,0,0,.4)}
.toast svg{width:18px;height:18px;flex:0 0 auto;color:#7BE0D2}
.toast.success{border-color:rgba(123,224,210,.3)}
.toast.error{border-color:rgba(255,138,148,.35)}
.toast.error svg{color:#FF8A94}
@keyframes toastIn{from{opacity:0;transform:translateY(20px) scale(.94)}to{opacity:1;transform:none}}

/* ---------- screen transitions ---------- */
.screen.enter{animation:pushIn .42s var(--ease)}
.screen.enter-back{animation:pushBack .42s var(--ease)}
.screen.enter-fade{animation:zoomIn .45s var(--ease)}
@keyframes pushIn{from{opacity:0;transform:translateX(34px) scale(.97)}to{opacity:1;transform:none}}
@keyframes pushBack{from{opacity:0;transform:translateX(-30px) scale(.97)}to{opacity:1;transform:none}}
@keyframes zoomIn{from{opacity:0;transform:scale(1.035)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}

/* ---------- side panel ----------
   Deliberately a fixed dark console regardless of the app's own theme —
   it's tool chrome for reviewing the prototype, not part of the product. */
.panel{width:320px;flex:0 0 auto;color:#b7c0bd;font-size:13px;position:sticky;top:30px;z-index:1;
  display:flex;flex-direction:column;gap:16px;max-height:calc(100vh - 60px);overflow-y:auto;
  padding-right:6px;scrollbar-width:thin}
.panel h1{font-family:'Sora',sans-serif;font-size:23px;font-weight:600;color:#f2f4f3;letter-spacing:-.04em}
.panel h1 b{background:linear-gradient(100deg,#3fc7b3,#e6875f);-webkit-background-clip:text;
  background-clip:text;color:transparent;font-weight:600}
.panel h1 small{display:block;font-size:12px;font-weight:400;color:#7d8985;letter-spacing:0;margin-top:5px;line-height:1.5}
.pbox{background:#1c2321;border:1px solid #2b332f;border-radius:var(--r-l);padding:16px}
.pbox h3{font-size:10px;font-weight:700;letter-spacing:.16em;color:#7d8985;text-transform:uppercase;margin-bottom:12px}
.pbox .prow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;font-size:12.5px}
.pbox .prow b{color:#f2f4f3;font-variant-numeric:tabular-nums;font-weight:600}
.pbtn{background:#232b28;color:#c3ccc9;border-radius:13px;padding:11px 13px;font-size:12.5px;
  font-weight:600;text-align:left;width:100%;border:1px solid #2f3835;
  transition:all .22s var(--ease)}
.pbtn:hover{background:#2a3330;border-color:#3fc7b3;color:#f2f4f3;transform:translateX(3px)}
.pbtn.on{background:linear-gradient(135deg,#3fc7b3,#1e8b7a);border-color:transparent;color:#04120f}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.flowlist{display:flex;flex-direction:column;gap:7px}
.panel .hint{color:#7d8985;line-height:1.55;font-size:11.5px;margin-top:10px}
.slider{width:100%;accent-color:#3fc7b3;height:3px;margin:4px 0 2px}
@media (max-width:1140px){
  body{flex-direction:column;align-items:center}
  .panel{width:390px;position:static;max-height:none}
  .device{position:relative;top:auto}
}

/* motion toggle from the control panel */
body.calm *,body.calm *::before,body.calm *::after{
  animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}


/* ---------- web delivery: embed + mobile + RTL ---------- */
.demo-bar{display:flex;gap:10px;align-items:flex-start;background:#1c2321;border:1px solid #3a2f22;border-radius:16px;
  padding:12px 14px;font-size:12px;line-height:1.5;color:#e9c9a8}

.panel .toplinks{display:flex;gap:8px;flex-wrap:wrap}

  border:1px solid #2f3835;border-radius:12px;padding:9px 10px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit}
.panel .toplinks a:hover,.panel .toplinks button:hover{border-color:#3fc7b3;color:#f2f4f3}
.panel .toplinks .on{background:linear-gradient(135deg,#3fc7b3,#1e8b7a);color:#04120f;border-color:transparent}
body{background:#15201e}
.panel-toggle,.panel-close{display:none}

/* embedded inside the landing page phone frame: device only */
body.embed{padding:0;background:#fff;display:block;overflow:hidden}
body.embed .panel,body.embed .panel-toggle{display:none !important}
body.embed .device{width:390px;height:869px;border-radius:0;box-shadow:none;position:relative;top:0}

/* phones: the app becomes the whole screen; demo controls live in a drawer */
@media (max-width:560px){
  body:not(.embed){padding:0;display:block;background:#fff}
  body:not(.embed) .device{position:fixed;inset:0;width:100%;height:100%;height:100dvh;border-radius:0;box-shadow:none;top:0}
  body:not(.embed) .panel{position:fixed;inset:auto 0 0 0;width:100%;max-height:82dvh;z-index:60;background:#121917;
    padding:18px 16px calc(18px + env(safe-area-inset-bottom));border-radius:22px 22px 0 0;transform:translateY(105%);
    transition:transform .35s cubic-bezier(.16,.84,.28,1);box-shadow:0 -20px 50px rgba(0,0,0,.4)}
  body.panel-open .panel{transform:none}
  .panel-toggle{display:flex;align-items:center;gap:7px;position:fixed;z-index:55;top:calc(10px + env(safe-area-inset-top));
    inset-inline-end:12px;background:#121917;color:#e7efed;border:1px solid #2f3835;border-radius:999px;padding:9px 13px;
    font-size:12px;font-weight:700;box-shadow:0 10px 24px rgba(0,0,0,.25);opacity:.92}
  .panel-toggle svg{width:15px;height:15px}
  .panel-close{display:block;position:absolute;top:12px;inset-inline-end:14px;color:#9fb0ac;font-size:13px;font-weight:600;padding:6px}
  body.panel-open .panel-toggle{display:none}
  body:not(.embed) .statusbar>*{visibility:hidden}
}

/* ============================================================
   0. LANGUAGE — English source strings, Arabic by lookup.
   Screens are written in English; after every render the text
   nodes are swapped for Arabic when Arabic is on.
   ============================================================ */
const QS = new URLSearchParams(location.search);
let LANG = (function(){
  const q = QS.get('lang'); if (q) return q === 'ar' ? 'ar' : 'en';
  try{ const v = localStorage.getItem('tailored-lang'); if (v) return v; }catch(e){}
  return (navigator.language||'').toLowerCase().indexOf('ar') === 0 ? 'ar' : 'en';
})();
/* keep sizes and dates left-to-right inside Arabic sentences */
function iso(x){ return String(x).replace(/(EU |US |UK )?[+\-]?\d[\d.,\-\u2153\u2154]*( ?mm| ?مم)?/g, t => /[\u2153\u2154]|^EU|\d{4}-\d/.test(t) ? '\u2066'+t+'\u2069' : t); }
const MISSING = new Set(); window.__missing = MISSING;
function tr(str){
  if (LANG !== 'ar' || str == null) return str;
  const m = String(str).match(/^(\s*)([\s\S]*?)(\s*)$/);
  const core = m[2];
  if (!core || !/[A-Za-z]/.test(core)) return str;
  if (Object.prototype.hasOwnProperty.call(T_EXACT, core)) return m[1] + iso(T_EXACT[core]) + m[3];
  for (let i=0;i<T_PATTERNS.length;i++){
    const p = T_PATTERNS[i], r = core.match(p[0]);
    if (r) return m[1] + iso(p[1].apply(null, r.slice(1))) + m[3];
  }
  if (!/^(EU|US|UK)?\s?[\d.⅓⅔]+$/.test(core) && !NO_TR.has(core)) MISSING.add(core);
  return str;
}
const NO_TR = new Set(['tAIlored','Nike','Adidas','New Balance','Zara','Skechers','Puma','mm','EGP','+20','9:41','InstaPay','ZARA','S','HG','HA']);
function localize(root){
  if (!root) return;
  root.setAttribute('dir', LANG === 'ar' ? 'rtl' : 'ltr');
  if (LANG !== 'ar') return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode:n =>
    n.parentNode && /^(STYLE|SCRIPT)$/.test(n.parentNode.nodeName) ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT });
  const nodes = []; while (w.nextNode()) nodes.push(w.currentNode);
  nodes.forEach(n => { const v = tr(n.nodeValue); if (v !== n.nodeValue) n.nodeValue = v; });
  root.querySelectorAll('[placeholder],[aria-label]').forEach(el => {
    ['placeholder','aria-label'].forEach(a => { if (el.hasAttribute(a)) el.setAttribute(a, tr(el.getAttribute(a))); });
  });
}
function setLang(l){
  LANG = l === 'ar' ? 'ar' : 'en';
  try{ localStorage.setItem('tailored-lang', LANG); }catch(e){}
  document.documentElement.lang = LANG;
  try{ const u = new URL(location.href); u.searchParams.set('lang', LANG); history.replaceState(null,'',u); }catch(e){}
  render('none');
}
document.documentElement.lang = LANG;
if (QS.get('embed') === '1') document.body.classList.add('embed');

/* --- 3a. Scan confidence (BRD FR-1.2, 80% acceptance threshold) --- */
const CONFIDENCE_THRESHOLD = 80;

function computeScanConfidence(scan){
  const ref = REF_OBJECTS[scan.refObj];
  const surfaceFactor = scan.surface === 'hard' ? 1 : 0.88;
  const raw = (0.46 * (scan.light/100) + 0.34 * (scan.steady/100) + 0.20)
            * ref.factor * surfaceFactor;
  return Math.max(28, Math.min(99, Math.round(raw * 100)));
}

/* Measurement error grows as confidence falls — this is what makes a
   low-confidence scan genuinely unsafe to size from, not just a warning. */
function simulateMeasurement(scan){
  const conf = computeScanConfidence(scan);
  const errBand = (100 - conf) * 0.22;            // mm of plausible error
  const jitter = () => (Math.random() * 2 - 1) * errBand;
  const L = 263 + jitter(), W = 98 + jitter() * 0.4;
  return {
    right:{ L:round1(L), W:round1(W), arch:round1(42 + jitter()*0.3) },
    left: { L:round1(L - 1.4 + jitter()*0.3), W:round1(W - 0.6), arch:round1(41.5) },
    confidence:conf, errBand:round1(errBand), accepted:conf >= CONFIDENCE_THRESHOLD,
    refObj:scan.refObj, date:new Date().toISOString().slice(0,10)
  };
}

/* --- 3b. Sizing engine --- */
/* Longer foot of the pair drives the size — standard fitting practice. */
function drivingFoot(m){ return m.right.L >= m.left.L ? m.right : m.left; }

function roundToStep(v, step){ return Math.round(v / step) * step; }

function sizeLabel(eu, step){
  if (Math.abs(step - 1/3) < 0.01){
    const whole = Math.floor(eu + 1e-6);
    const frac = eu - whole;
    if (frac < 0.17) return String(whole);
    if (frac < 0.5)  return whole + '\u2153';
    return whole + '\u2154';
  }
  return (Math.round(eu*2)/2).toString();
}

function recommend(brandId, m, productBias){
  const b = BRANDS[brandId];
  if (!b || !b.mapped) return { mapped:false, brand:b };
  const foot = drivingFoot(m);
  const offset = S.brandOffset[brandId] || 0;
  const bias = productBias || 0;
  const prefShift = FIT_PREF_SHIFT[S.prefs.fit] || 0;
  const effectiveAllowance = b.allowance + offset + bias + prefShift;

  /* width pressure: how much wider the foot is than the brand's last.
     A wide foot needs a longer size to borrow width from — which is what
     a human fitter does, so the engine searches neighbouring sizes too. */
  const ratio = foot.W / foot.L;
  const widthPressure = (ratio - b.widthProfile) * 1000;
  const scoreAt = eu => (eu * 6.6667 - effectiveAllowance - foot.L) - widthPressure * WIDTH_WEIGHT;

  const base = roundToStep((foot.L + effectiveAllowance) / 6.6667, b.step);
  let eu = base, best = Infinity;
  for (let k = -2; k <= 4; k++){
    const cand = roundToStep(base + k * b.step, b.step);
    const d = Math.abs(scoreAt(cand) - IDEAL_ROOM);
    if (d < best){ best = d; eu = cand; }
  }

  const score = scoreAt(eu);
  const residual = round1(eu * 6.6667 - effectiveAllowance - foot.L);
  let fit;
  if (score < -3.5)      fit = 'tight';
  else if (score < -1.2) fit = 'snug';
  else if (score <= 3.8) fit = 'perfect';
  else if (score <= 6.5) fit = 'loose';
  else                   fit = 'too-loose';

  /* confidence: scan quality x brand data depth x how cleanly the size lands */
  const dataConf = Math.min(1, 0.20 + Math.log10(b.users + 1) / 3.4);
  const landing = 1 - Math.min(1, Math.abs(score - IDEAL_ROOM) / 9);
  const scanConf = m.confidence / 100;
  let confidence = Math.round(scanConf * dataConf * (0.55 + 0.45 * landing) * 100);
  if (!m.accepted) confidence = Math.min(confidence, 62);   // low-confidence scan caps everything
  confidence = Math.max(18, Math.min(97, confidence));

  return {
    mapped:true, brand:b, eu, label:sizeLabel(eu, b.step),
    us:round1(eu - 33.5), uk:round1(eu - 34.5),
    residual, widthPressure:round1(widthPressure), score:round1(score), fit, confidence,
    tier: confidence >= 80 ? 'high' : confidence >= 62 ? 'medium' : 'low'
  };
}

function allRecommendations(m){
  return Object.keys(BRANDS).map(id => ({ id, rec:recommend(id, m) }));
}

/* --- 3c. Feedback loop (BRD FR-2.2) --- */
/* Real learning: reported fit shifts the brand's allowance for next time. */
const FEEDBACK_SHIFT = { 'tight':+3.5, 'snug':+1.8, 'perfect':0, 'loose':-1.8, 'too-loose':-3.5 };
function applyFeedback(brandId, reportedFit){
  const before = S.brandOffset[brandId] || 0;
  const after = round1(before + FEEDBACK_SHIFT[reportedFit]);
  S.brandOffset[brandId] = after;
  return { before, after, changed:after !== before };
}

/* --- 3d. Stock --- */
function stockFor(product, sizeLabelStr){
  const s = product.stock[sizeLabelStr];
  return s === undefined ? null : s;      // null = size not produced, 0 = sold out
}
function nearestAvailable(product){
  return Object.keys(product.stock).filter(k => product.stock[k] > 0);
}

/* ============================================================
   4d. CANVAS — the live depth scanner
   ============================================================ */
const Scan = (function(){
  let raf = null, pts = null, t0 = 0;

  /* Half-width down a real foot: heel, the narrow waist at the arch,
     the ball at its widest, then the toe taper. Normalised to 1. */
  const PROFILE = [[0,0],[0.04,0.46],[0.11,0.66],[0.20,0.70],[0.32,0.60],[0.45,0.63],
                   [0.60,0.86],[0.70,1.00],[0.79,0.97],[0.87,0.84],[0.94,0.62],[0.985,0.34],[1,0]];
  function width(u){
    u = Math.max(0, Math.min(1, u));
    for (let i=1;i<PROFILE.length;i++){
      if (u <= PROFILE[i][0]){
        const a = PROFILE[i-1], b = PROFILE[i];
        const t = (u - a[0]) / (b[0] - a[0]);
        return a[1] + (b[1]-a[1]) * (t*t*(3-2*t));
      }
    }
    return 0;
  }
  function build(n){
    const a = []; let guard = 0;
    while (a.length < n && guard++ < n*14){
      const u = Math.random(), v = Math.random()*2-1;
      if (Math.abs(v) > width(u)) continue;
      const arch = Math.exp(-Math.pow((u-0.38)/0.30,2)) * (1 - Math.abs(v)*0.55);
      a.push({ u:u, v:v, h:Math.max(0,arch) });
    }
    return a;
  }
  function stop(){ if (raf) cancelAnimationFrame(raf); raf = null; }
  /* opts.surface: 'dark' for the full-bleed camera/processing screens (bright
     teal on near-black, needs to read like a live sensor); 'light' for the
     home-card widget sitting on a white surface (dark teal on paper). */
  function start(canvas, opts){
    stop();
    const light = opts.surface === 'light';
    const ctx = canvas.getContext('2d');
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = canvas.clientWidth * dpr;
    canvas.height = canvas.clientHeight * dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);

    const quality = Math.max(0.18, Math.min(1, (opts.light/100)*0.6 + (opts.steady/100)*0.4));
    pts = build(Math.round(260 + quality*840));
    t0 = performance.now();
    const dotCol = light ? '15,92,86' : '45,227,200';
    const hotCol = light ? '15,92,86' : '170,255,240';
    const contourCol = light ? '15,92,86' : '45,227,200';

    function frame(now){
      const W = canvas.clientWidth, H = canvas.clientHeight;
      if (!W || !H){ raf = requestAnimationFrame(frame); return; }
      const time = (now - t0)/1000;
      ctx.clearRect(0,0,W,H);

      if (light){
        ctx.fillStyle = '#eef6f5'; ctx.fillRect(0,0,W,H);
      } else {
        const g = ctx.createRadialGradient(W*0.5,H*0.45,10,W*0.5,H*0.5,H*0.78);
        g.addColorStop(0,'rgba(18,58,52,'+(0.30+quality*0.32)+')');
        g.addColorStop(1,'rgba(4,16,14,1)');
        ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
      }

      /* a foot is ~2.6x longer than wide — proportion to that, not to the canvas */
      const len = Math.min(H*0.55, W*1.5);
      const halfW = len*0.21;
      const cx = W*0.5, top = (H - len)*0.40;
      const yOf = u => top + (1-u)*len;          // toes away from the viewer
      const jitter = (1-quality)*9;
      const sweep = (time*0.42) % 1.35;

      ctx.lineWidth = 1;
      const scales = [1,0.80,0.60,0.42,0.26];
      for (let k=0;k<scales.length;k++){
        const s = scales[k];
        const y = u => top + (1 - (0.5 + (u-0.5)*(0.30+0.70*s)))*len;
        ctx.beginPath();
        for (let i=0;i<=72;i++){ const u=i/72, x=cx+width(u)*halfW*s;
          i===0 ? ctx.moveTo(x,y(u)) : ctx.lineTo(x,y(u)); }
        for (let i=72;i>=0;i--){ const u=i/72; ctx.lineTo(cx-width(u)*halfW*s, y(u)); }
        ctx.closePath();
        ctx.strokeStyle = 'rgba('+contourCol+','+(k===0?(light?0.55:0.34):(light?0.14:0.05)+0.04*(scales.length-k))+')';
        ctx.stroke();
      }

      for (let i=0;i<pts.length;i++){
        const p = pts[i];
        const x = cx + p.v*halfW + Math.sin(time*2.4+i)*jitter*0.4;
        const y = yOf(p.u) + Math.cos(time*2.1+i*1.7)*jitter*0.4;
        const hot = Math.max(0, 1 - Math.abs(p.u-sweep)*9);
        const alpha = Math.min(1, (light?0.30:0.22) + p.h*0.50*quality + hot*0.85);
        const size = 1 + p.h*1.6 + hot*2.1;
        ctx.fillStyle = hot > 0.35 ? 'rgba('+hotCol+','+alpha+')' : 'rgba('+dotCol+','+alpha+')';
        ctx.fillRect(x,y,size,size);
      }

      if (sweep <= 1){
        const y = yOf(sweep);
        const lg = ctx.createLinearGradient(cx-halfW*1.3,0,cx+halfW*1.3,0);
        lg.addColorStop(0,'rgba('+dotCol+',0)');
        lg.addColorStop(.5,'rgba('+hotCol+','+(light?0.7:0.95)+')');
        lg.addColorStop(1,'rgba('+dotCol+',0)');
        ctx.fillStyle = lg; ctx.fillRect(cx-halfW*1.3, y-1, halfW*2.6, 2);
      }

      const ro = opts.refObj;
      const rw = ro==='a4'?46:ro==='coin'?17:40, rh = ro==='a4'?64:ro==='coin'?17:25;
      ctx.save(); ctx.translate(cx+halfW*1.35, top+len*0.58); ctx.rotate(-0.06);
      ctx.fillStyle = light ? 'rgba(15,92,86,'+(0.06+quality*0.06)+')' : 'rgba(234,247,243,'+(0.10+quality*0.16)+')';
      ctx.strokeStyle = 'rgba('+contourCol+','+(0.35+quality*0.4)+')';
      ctx.lineWidth = 1.2;
      if (ro==='coin'){ ctx.beginPath(); ctx.arc(0,0,rh/2,0,Math.PI*2); ctx.fill(); ctx.stroke(); }
      else { ctx.fillRect(-rw/2,-rh/2,rw,rh); ctx.strokeRect(-rw/2,-rh/2,rw,rh); }
      ctx.restore();

      raf = requestAnimationFrame(frame);
    }
    raf = requestAnimationFrame(frame);
  }
  return { start:start, stop:stop };
})();

/* ============================================================
   5. ROUTER
   ============================================================ */
const device = document.getElementById('device');
let stack = [], sheet = null;

function go(name, opts){
  opts = opts || {};
  if (!opts.replace) stack.push({ name:name, args:opts.args || {} });
  else stack[stack.length-1] = { name:name, args:opts.args || {} };
  render(opts.back ? 'enter-back' : opts.fade ? 'enter-fade' : 'enter');
}
function back(){ if (stack.length > 1){ stack.pop(); render('enter-back'); } }
function reset(name){ stack = [{ name:name, args:{} }]; render('enter-fade'); }
function openSheet(fn){ sheet = fn; render('none'); }
function closeSheet(){ sheet = null; render('none'); }
function dismissSheet(){ sheet = null; }
function current(){ return stack[stack.length-1]; }

function render(anim){
  Scan.stop();
  const cur = current();
  const view = SCREENS[cur.name];
  if (!view){ device.innerHTML = '<div style="padding:40px">Unknown screen: '+cur.name+'</div>'; return; }
  device.innerHTML = DEFS
    + '<section class="screen'+(anim && anim!=='none' ? ' '+anim : '')+'">'+view(cur.args||{})+'</section>'
    + (sheet ? '<div class="scrim" data-act="sheet-dismiss"><div class="sheet">'+sheet()+'</div></div>' : '')
    + '<div class="toasts" id="toasts"></div>';
  localize(device);
  animateIn();
  flushToasts();
  renderPanel();
}

function animateIn(){
  document.querySelectorAll('[data-count]').forEach(el => {
    const target = parseFloat(el.getAttribute('data-count'));
    const dec = +(el.getAttribute('data-dec') || 0);
    if (isNaN(target)) return;
    const dur = 750, t0 = performance.now();
    (function step(now){
      const k = Math.min(1,(now-t0)/dur), e = 1-Math.pow(1-k,3);
      el.textContent = (target*e).toFixed(dec);
      if (k < 1) requestAnimationFrame(step);
    })(t0);
  });
  requestAnimationFrame(() => {
    document.querySelectorAll('[data-ring]').forEach(el => {
      const pct = +el.getAttribute('data-ring'), C = 2*Math.PI*38;
      el.style.strokeDashoffset = (C*(1-pct/100)).toFixed(1);
    });
  });
  const cv = document.getElementById('scanCanvas');
  if (cv) Scan.start(cv, { light:S.scan.light, steady:S.scan.steady, refObj:S.scan.refObj,
    surface: cv.dataset.surface === 'light' ? 'light' : 'dark' });
}

let toastQueue = [];
function toast(msg, tone){
  toastQueue.push({ msg:msg, tone:tone||'' });
  flushToasts();
  setTimeout(() => { toastQueue.shift(); flushToasts(); }, 3200);
}
function flushToasts(){
  const el = document.getElementById('toasts');
  if (!el) return;
  el.innerHTML = toastQueue.map(t =>
    '<div class="toast '+t.tone+'">'
    + icon(t.tone==='error'?'error':t.tone==='success'?'check':'sparkle',18,t.tone==='error'?'rose':'aqua')
    + '<span>'+esc(t.msg)+'</span></div>').join('');
  localize(el);
}

/* Live scanner. Lighting and steadiness are real inputs driving both the
   picture and the confidence score, so the 80% branch is computed. */
SCREENS.capture = (args) => {
  const conf = computeScanConfidence(S.scan);
  const second = args.foot === 'left';
  let msg, cls, blocked = false;
  if (S.scan.light < 40){ msg = 'Too dark \u2014 find brighter light'; cls = 'bad'; blocked = true; }
  else if (S.scan.steady < 45){ msg = 'Hold the phone steadier'; cls = 'bad'; blocked = true; }
  else if (conf < CONFIDENCE_THRESHOLD){ msg = 'Readable, but only '+conf+'% confident'; cls = ''; }
  else { msg = second ? 'Left foot detected \u2014 hold still' : 'Right foot detected \u2014 hold still'; cls = 'good'; }

  return '<div class="cam">'
    + '<canvas id="scanCanvas"></canvas><div class="cam-vig"></div>'
    + statusbar()
    + '<div class="cam-top"><button data-act="cancel-scan">Cancel</button>'
    + '<span class="cam-pill">'+(second?'Left \u00b7 2 of 2':'Right \u00b7 1 of 2')+'</span>'
    + '<span style="width:60px"></span></div>'
    + '<div class="cam-msg '+cls+'">'+icon(cls==='bad'?'warn':cls==='good'?'check':'info',17,cls==='bad'?'rose':'aqua')
    + '<span>'+msg+'</span></div>'
    + '<button class="shutter" data-act="'+(second?'capture-left':'capture-right')+'"'
    + (blocked?' disabled':'')+' aria-label="Capture"><i></i></button>'
    + '<div class="homeind"><i></i></div></div>';
};

    + '</div></div>'

    + (ok
      ? btn('Save and see my sizes','accent','accept-measurement') + btn('View full measurements','tertiary','goto-measurements')

function lowConfReason(){
  const s = S.scan;
  if (s.light < 55) return 'the light was too low for a clean outline';
  if (s.steady < 60) return 'camera shake blurred the edge of the foot';
  if (s.refObj === 'coin') return 'the coin is small, so a few pixels of error become millimetres';
  if (s.surface === 'carpet') return 'carpet hides where the foot actually ends';
  return 'the reference object was only partly readable';
}

    + alert('info','Your feet differ by '+round1(Math.abs(m.right.L-m.left.L))+' mm. We size to the longer one, which is standard fitting practice.')
    + row({ title:'Captured', value:m.date })
    + row({ title:'Reference used', value:REF_OBJECTS[m.refObj].name })

function widthCategory(f){
  const r = f.W / f.L;
  if (r < 0.362) return 'Narrow (B)';
  if (r < 0.378) return 'Medium (D)';
  if (r < 0.392) return 'Wide (2E)';
  return 'Extra wide (4E)';
}

/* EU labels can carry thirds, so sort on the real number, not the string. */
function euNum(l){
  const s = String(l);
  const base = parseFloat(s);
  if (s.indexOf('\u2153') > -1) return base + 1/3;
  if (s.indexOf('\u2154') > -1) return base + 2/3;
  return base;
}

SCREENS.brandDetail = (args) => {
  const id = args.brand || S.activeBrand;
  const b = BRANDS[id];
  const m = S.measurement;
  if (!m) return statusbar() + appbar(b.name) + '<div class="content">'
    + '<div class="spacer"></div>'
    + '<div style="text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px">'
    + '<div class="dot" style="width:64px;height:64px">'+icon('ruler',28)+'</div>'
    + '<b style="font-size:18px">Scan first</b>'
    + '<p class="sub">'+b.name+' sizes are calculated from your measurement.</p>'
    + btn('Start scan','accent','goto-scan')+'</div>'
    + '<div class="spacer"></div></div>' + homeind();
  if (!b.mapped) return statusbar() + appbar(b.name) + '<div class="content">'
    + '<div class="spacer"></div>'
    + '<div style="text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px">'
    + '<div class="dot" style="width:64px;height:64px">'+icon('info',28)+'</div>'
    + '<b style="font-size:18px">'+b.name+' is not mapped yet</b>'
    + '<p class="sub">We have not verified '+b.name+' sizing against Egyptian stock. Guessing here would be worse than saying nothing.</p>'
    + btn('Notify me when it\u2019s live','primary','notify-brand',{ data:id })+'</div>'
    + '<div class="spacer"></div>'
    + alert('warning','Generic conversion suggests EU '+Math.round((drivingFoot(m).L+22)/6.6667)+', but that is not a tAIlored recommendation.')
    + btn('Browse mapped brands','tertiary','goto-brands')
    + '</div>' + homeind();

  const rec = recommend(id, m);
  const step = b.step;
  const alts = [-2,-1,1,2].map(k => {
    const eu = roundToStep(rec.eu + k*step, step);
    const alt = simulateFitAt(id, eu, m);
    return { eu:eu, label:sizeLabel(eu, step), fit:alt };
  });
  const off = S.brandOffset[id] || 0;
  return statusbar() + appbar(b.name) + '<div class="content">'
    + recCard(id, rec)
    + '<div class="sect">Other sizes in this brand</div>'
    + alts.map(a => '<div style="display:flex;flex-direction:column;gap:5px;margin-bottom:6px">'
        + '<div style="font-size:13px;font-weight:700;color:var(--ink-2)">EU '+a.label+'</div>'
        + fitScale(a.fit)+'</div>').join('')
    + (off ? alert('success','Adjusted '+(off>0?'+':'')+off+' mm for you after your fit feedback on '+b.name+'.')
           : alert('info','Learned from '+b.users.toLocaleString()+' users with feet like yours.'))
    + '<div class="spacer"></div>'
    + btn('Shop '+b.name+' in EU '+rec.label,'accent','open-catalog',{ data:id })
    + '</div>' + homeind();
};
function simulateFitAt(brandId, eu, m){
  const b = BRANDS[brandId];
  const foot = drivingFoot(m);
  const eff = b.allowance + (S.brandOffset[brandId]||0) + (FIT_PREF_SHIFT[S.prefs.fit]||0);
  const wp = (foot.W/foot.L - b.widthProfile) * 1000;
  const score = (eu * 6.6667 - eff - foot.L) - wp * WIDTH_WEIGHT;
  if (score < -3.5) return 'tight';
  if (score < -1.2) return 'snug';
  if (score <= 3.8) return 'perfect';
  if (score <= 6.5) return 'loose';
  return 'too-loose';
}

SCREENS.catalog = (args) => {
  const brandId = args.brand || S.catalogBrand;
  const b = BRANDS[brandId];
  const m = S.measurement;
  const items = PRODUCTS.filter(p => p.brand === brandId);
  const shown = items.filter(p => {
    if (!m || S.catalogFilter !== 'fits') return true;
    const r = recommend(brandId, m, p.lastBias);
    return stockFor(p, r.label) > 0;
  });
  const cards = shown.map(p => {
    const r = m ? recommend(brandId, m, p.lastBias) : null;
    const stock = r ? stockFor(p, r.label) : null;
    const badge = !m ? '<span class="badge neutral">Scan for fit</span>'
      : stock === null ? '<span class="badge neutral">Size not made</span>'
      : stock === 0 ? '<span class="badge error">EU '+r.label+' sold out</span>'
      : r.fit === 'perfect' ? '<span class="badge success">Fits EU '+r.label+'</span>'
      : '<span class="badge warning">'+FIT_LABEL[r.fit].split(' \u2014')[0]+'</span>';
    return '<button class="pcard'+(stock===0?' out':'')+'" data-act="open-product" data-arg="'+p.id+'">'
      + '<span class="pimg">'+shoeArt(p.id,{thin:true})+'<span class="shine"></span></span>'
      + badge
      + '<span class="pb">'+b.name.toUpperCase()+'</span>'
      + '<span class="pn">'+p.name+'</span>'
      + '<span class="pp">'+money(p.price)+'</span></button>';
  }).join('');
  return statusbar() + appbar(b.name, { action:cartBtn() }) + '<div class="content">'
    + '<div class="chips">'
    + '<button class="chip" aria-pressed="'+(S.catalogFilter==='fits')+'" data-act="set-filter" data-arg="fits">Available in my size</button>'
    + '<button class="chip" aria-pressed="'+(S.catalogFilter==='all')+'" data-act="set-filter" data-arg="all">Everything</button>'
    + '</div>'
    + (shown.length ? '<div class="grid">'+cards+'</div>'
      : alert('info','Nothing from '+b.name+' is in stock in EU '+recommend(brandId,m).label+' right now. Switch to Everything to see the rest.'))
    + '</div>' + homeind();
};
function cartBtn(){
  const n = S.cart.reduce((a,i)=>a+i.qty,0);
  return '<button class="iconbtn" data-act="goto-cart" aria-label="Cart" style="position:relative">'+icon('cart')

/* ---------- PRODUCT ---------- */
SCREENS.product = (args) => {
  const p = PRODUCTS.find(x => x.id === (args.id || S.activeProduct));
  const b = BRANDS[p.brand];
  const m = S.measurement;
  const rec = (m && BRANDS[p.brand].mapped) ? recommend(p.brand, m, p.lastBias) : null;
  const sizes = Object.keys(p.stock).sort((a,b) => euNum(a) - euNum(b));
  const chosen = S.selectedSize || (rec && stockFor(p, rec.label) > 0 ? rec.label : null);
  const soldOut = rec && stockFor(p, rec.label) === 0;
  const notMade = rec && stockFor(p, rec.label) === null;

  const chipRow = sizes.map(sz => {
    const st = p.stock[sz];
    return '<button class="chip" aria-pressed="'+(chosen===sz)+'"'+(st===0?' disabled':'')
      + ' data-act="pick-size" data-arg="'+sz+'">EU '+sz+'</button>';
  }).join('');

  let fitBlock = '';
  if (rec){
    if (soldOut) fitBlock = alert('error','Your size, EU '+rec.label+', is sold out. The sizes left are more than 5 mm away from your foot.');
    else if (notMade) fitBlock = alert('warning','This model is not produced in EU '+rec.label+'.');
    else if (p.lastBias > 2) fitBlock = alert('warning','This model runs narrow. We already moved you up to EU '+rec.label+' \u2014 '+Math.round(62+Math.random()*8)+'% of users with your width did the same.');
    else if (p.lastBias < -1) fitBlock = alert('info','Roomy last. EU '+rec.label+' accounts for it.');
  }

  return statusbar() + appbar(p.name, { action:cartBtn() }) + '<div class="content">'
    + '<div class="pimg" style="aspect-ratio:16/9">'+shoeArt(p.id)+'<span class="shine"></span></div>'
    + '<div><span style="font-size:10px;letter-spacing:.18em;color:var(--ink-3);font-weight:700">'+b.name.toUpperCase()+'</span>'
    + '<h2 class="title" style="margin-top:5px;font-size:24px">'+p.name+'</h2>'
    + '<div style="font-family:\'Sora\',sans-serif;font-size:21px;font-weight:600;margin-top:8px;letter-spacing:-.03em">'+money(p.price)+'</div></div>'
    + (rec && !soldOut && !notMade ? '<span class="badge '+(rec.fit==='perfect'?'success':'warning')+'">'
        + (rec.fit==='perfect'?'Fits your EU '+rec.label:FIT_LABEL[rec.fit])+'</span>' : '')
    + (rec && !soldOut && !notMade ? fitScale(rec.fit) : '')
    + fitBlock
    + '<div class="sect">Size</div><div class="chips">'+chipRow+'</div>'
    + '<div class="spacer"></div>'
    + (soldOut || notMade
      ? btn('Notify me when EU '+rec.label+' is back','primary','notify-size',{ data:p.id })
        + btn('Show '+b.name+' styles that fit','tertiary','open-catalog',{ data:p.brand })
      : btn(chosen ? 'Add EU '+chosen+' to cart' : 'Choose a size','accent','add-cart',{ data:p.id, disabled:!chosen })
        + btn('Why this size for me?','tertiary','open-brand',{ data:p.brand }))
    + '</div>' + homeind();
};

  'do-delete-a':() => { S = initialState(); closeSheet(); toast('Account deleted','success'); reset('home'); },

      brandOffsets:S.brandOffset, orders:S.orders, prefs:S.prefs, exportedAt:new Date().toISOString() };

    const a = document.createElement('a');

    URL.revokeObjectURL(a.href);
    toast('Data exported','success');
  }
};

function commitMeasurement(){
  const m = S.measurement;
  if (!S.account){
    S.history.push(m);
    openSheet(SHEETS.guestGate);
    S.ui.tab='sizes'; stack=[{name:'sizes',args:{}}];
    render('none');
    return;
  }
  S.history.push(m);
  toast(m.accepted ? 'Measurement saved' : 'Saved with low confidence', m.accepted?'success':'');
  S.ui.tab='sizes'; reset('sizes');
}

function runProcessing(){
  const steps = ['Detecting foot outline','Calibrating against '+REF_OBJECTS[S.scan.refObj].name.toLowerCase(),
                 'Correcting camera perspective','Measuring length and width','Scoring confidence'];
  let pct = 4, i = 0;
  const t = setInterval(() => {
    pct += 6 + Math.random()*7;
    const bar = document.getElementById('procBar'), st = document.getElementById('procStep');
    if (!bar){ clearInterval(t); return; }
    bar.style.width = Math.min(100,pct)+'%';
    const ni = Math.min(steps.length-1, Math.floor(pct/21));
    if (ni !== i){ i = ni; st.textContent = tr(steps[i]); }
    if (pct >= 100){
      clearInterval(t);
      S.measurement = simulateMeasurement(S.scan);
      go('result',{ replace:true, fade:true });
    }
  }, 190);
}

document.addEventListener('click', e => {
  const tab = e.target.closest('[data-tab]');
  if (tab){
    const t = tab.getAttribute('data-tab');
    S.ui.tab = t;
    const map = { home:'home', scan:'scanIntro', sizes:'sizes', brands:'brands', profile:'profile' };
    closeSheet(); reset(map[t]); return;
  }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.getAttribute('data-act');
  if (act === 'sheet-dismiss' && e.target.closest('.sheet') && el.classList.contains('scrim')) return;
  const fn = ACTIONS[act];
  if (fn){ e.preventDefault(); fn(el.getAttribute('data-arg')); }
});
document.addEventListener('input', e => {
  if (e.target.matches('[data-otp]')){
    const i = +e.target.getAttribute('data-otp');
    e.target.value = e.target.value.replace(/\D/g,'').slice(0,1);
    if (e.target.value && i < 5){
      const n = document.querySelector('[data-otp="'+(i+1)+'"]'); if (n) n.focus();
    }
  }
});

     ['Sold out in your size','sc-stock'],
     ['Unmapped brand','sc-unmapped'],
     ['Fit feedback retunes sizing','sc-feedback'],
     ['Privacy \u2014 export & delete','sc-privacy']].map(s =>
      '<button class="pbtn" data-scn="'+s[1]+'">'+s[0]+'</button>').join('')
  + '</div></div>'

  + '<div class="pbox"><h3>Environment</h3><div class="pgrid">'
  + '<button class="pbtn '+(S.ui.reduceMotion?'on':'')+'" data-env="motion">Reduce motion</button>'
  + '<button class="pbtn" data-env="reset">Reset session</button>'
  + '</div></div>';
  localize(p);
  const tl = document.getElementById('panelToggleLbl'); if (tl) tl.textContent = tr('Demo controls');
}

document.addEventListener('input', e => {
  const c = e.target.getAttribute && e.target.getAttribute('data-ctl');
  if (!c) return;
  S.scan[c] = +e.target.value;
  renderPanel();
  const n = current().name;
  if (n === 'capture' || n === 'home') render('none');
});
document.addEventListener('click', e => {
  const env = e.target.closest('[data-env]');
  if (env){
    const k = env.getAttribute('data-env');
    if (k === 'motion'){
      S.ui.reduceMotion = !S.ui.reduceMotion;
      document.body.classList.toggle('calm', S.ui.reduceMotion);
      renderPanel();
    }
    if (k === 'reset'){ S = initialState(); toast('Session reset'); reset('home'); }
    if (k === 'lang-en') setLang('en');
    if (k === 'lang-ar') setLang('ar');
    if (k === 'close') document.body.classList.remove('panel-open');
    return;
  }
  const scn = e.target.closest('[data-scn]');
  if (scn){ runScenario(scn.getAttribute('data-scn')); document.body.classList.remove('panel-open'); }
  if (e.target.closest('#panelToggle')) document.body.classList.add('panel-open');
});

function seedMeasurement(quality){
  S.scan.light = quality==='low' ? 54 : 82;
  S.scan.steady = quality==='low' ? 58 : 88;
  S.scan.refObj = quality==='low' ? 'coin' : 'card';
  S.scan.surface = quality==='low' ? 'carpet' : 'hard';
  S.measurement = simulateMeasurement(S.scan);
  S.history = [S.measurement];
  S.cameraGranted = true;
}
function runScenario(id){
  const rm = S.ui.reduceMotion; S = initialState(); S.ui.reduceMotion = rm; dismissSheet();
  if (id==='sc-happy'){ S.account={name:'Hatem G.',phone:'10 1234 5678'}; reset('home'); toast('Start with Measure \u2192 scan'); }
  if (id==='sc-low'){ S.account={name:'Hatem G.',phone:'10 1234 5678'};
    S.scan={light:54,steady:58,refObj:'coin',surface:'carpet'}; S.cameraGranted=true;
    reset('capture'); stack=[{name:'capture',args:{foot:'left'}}]; render('enter-fade');
    toast('Capture now \u2014 confidence will land below 80%'); }
  if (id==='sc-denied'){ S.cameraGranted=false; reset('cameraDenied'); }
  if (id==='sc-guest'){ S.account=null; seedMeasurement('good'); S.measurement.accepted=true;
    reset('sizes'); openSheet(SHEETS.guestGate); }
  if (id==='sc-stock'){ S.account={name:'Hatem G.',phone:'10 1234 5678'}; seedMeasurement('good');
    S.activeProduct='dunk'; reset('product'); stack=[{name:'product',args:{id:'dunk'}}]; render('enter-fade'); }
  if (id==='sc-unmapped'){ S.account={name:'Hatem G.',phone:'10 1234 5678'}; seedMeasurement('good');
    reset('brandDetail'); stack=[{name:'brandDetail',args:{brand:'puma'}}]; render('enter-fade'); }
  if (id==='sc-feedback'){ S.account={name:'Hatem G.',phone:'10 1234 5678'}; seedMeasurement('good');
    S.orders=[{id:'TA-48219',items:[{id:'peg41',size:recommend('nike',S.measurement).label,qty:1,price:4850}],total:4910,date:S.measurement.date}];
    reset('feedback'); stack=[{name:'feedback',args:{id:'TA-48219'}}]; render('enter-fade');
    toast('Pick a fit \u2014 watch the Nike offset change'); }
  if (id==='sc-privacy'){ S.account={name:'Hatem G.',phone:'10 1234 5678'}; seedMeasurement('good'); reset('privacy'); }
}

/* ============================================================
   11. BOOT
   ============================================================ */
stack = [{ name:'home', args:{} }];
render('enter-fade');

</script>
</body>
</html>
